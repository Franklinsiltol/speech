<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferramenta de Análise de Fala</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 50px;
        }
        .waveform {
            margin: 20px 0;
        }
        .cloud, .insights, .ranking {
            margin-top: 30px;
        }
        .highlight-positive {
            color: green;
            font-weight: bold;
        }
        .highlight-negative {
            color: red;
            font-weight: bold;
        }
        #wordCloudCanvas {
            border: 1px solid #ccc;
            width: 100%;
            height: 300px;
        }
        .upload-section {
            background-color: #e9ecef;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .recording-section {
            background-color: #fff3cd;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .audio-player {
            margin: 15px 0;
        }
        .processing-status {
            margin: 10px 0;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="text-center">Ferramenta de Análise de Fala</h1>

    <div class="row">
        <div class="col-md-6">
            <label for="positiveWords">Palavras Positivas (separadas por vírgula)</label>
            <input type="text" id="positiveWords" class="form-control" placeholder="Ex: bom, ótimo, excelente">
        </div>
        <div class="col-md-6">
            <label for="negativeWords">Palavras Negativas (separadas por vírgula)</label>
            <input type="text" id="negativeWords" class="form-control" placeholder="Ex: ruim, péssimo, horrível">
        </div>
    </div>

    <!-- Seção de Upload de Arquivo -->
    <div class="upload-section">
        <h4>📁 Upload de Gravação</h4>
        <div class="row">
            <div class="col-md-8">
                <input type="file" id="audioFileInput" class="form-control-file" accept="audio/*">
                <small class="form-text text-muted">Formatos suportados: MP3, WAV, M4A, OGG</small>
            </div>
            <div class="col-md-4">
                <button id="processAudioFile" class="btn btn-info" disabled>Processar Arquivo</button>
            </div>
        </div>
        <div id="uploadedAudioPlayer" class="audio-player" style="display: none;">
            <audio controls style="width: 100%;"></audio>
        </div>
        <div id="processingStatus" class="processing-status"></div>
    </div>

    <!-- Seção de Gravação ao Vivo -->
    <div class="recording-section">
        <h4>🎤 Gravação ao Vivo</h4>
        <div class="row">
            <div class="col-md-12">
                <button id="startRecording" class="btn btn-primary">Iniciar Gravação</button>
                <button id="stopRecording" class="btn btn-danger" disabled>Parar Gravação</button>
            </div>
        </div>
    </div>

    <div class="row transcription">
        <div class="col-md-12">
            <h3>Transcrição</h3>
            <div id="transcriptionText" class="p-3 border bg-light"></div>
        </div>
    </div>

    <div class="row cloud">
        <div class="col-md-12">
            <h3>Nuvem de Palavras</h3>
            <canvas id="wordCloudCanvas"></canvas>
        </div>
    </div>

    <div class="row ranking">
        <div class="col-md-6">
            <h3>Ranking de Palavras Positivas</h3>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Palavra</th>
                        <th>Ocorrências</th>
                    </tr>
                </thead>
                <tbody id="positiveRankingTableBody"></tbody>
            </table>
        </div>
        <div class="col-md-6">
            <h3>Ranking de Palavras Negativas</h3>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Palavra</th>
                        <th>Ocorrências</th>
                    </tr>
                </thead>
                <tbody id="negativeRankingTableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col-md-12 text-center">
            <button id="downloadData" class="btn btn-success">Baixar Dados</button>
        </div>
    </div>
</div>

<script>
// IndexedDB setup
let db;
const request = indexedDB.open('SpeechAnalyticsDB', 1);

request.onupgradeneeded = function(event) {
    db = event.target.result;
    db.createObjectStore('transcriptions', { keyPath: 'id', autoIncrement: true });
};

request.onsuccess = function(event) {
    db = event.target.result;
};

request.onerror = function(event) {
    console.error('Erro ao abrir IndexedDB', event);
};

// Web Speech API setup for transcription via microphone in Portuguese
const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
recognition.continuous = false;
recognition.interimResults = false;
recognition.lang = 'pt-BR';

let isRecording = false;
let fullTranscription = '';

// === FUNCIONALIDADE DE UPLOAD DE ARQUIVO ===

// Habilitar botão quando arquivo for selecionado
document.getElementById('audioFileInput').addEventListener('change', function(event) {
    const file = event.target.files[0];
    const processButton = document.getElementById('processAudioFile');
    const audioPlayer = document.getElementById('uploadedAudioPlayer');
    const audio = audioPlayer.querySelector('audio');
    
    if (file) {
        processButton.disabled = false;
        
        // Mostrar player de áudio
        const audioURL = URL.createObjectURL(file);
        audio.src = audioURL;
        audioPlayer.style.display = 'block';
        
        // Limpar status anterior
        document.getElementById('processingStatus').innerHTML = '';
    } else {
        processButton.disabled = true;
        audioPlayer.style.display = 'none';
    }
});

// Processar arquivo de áudio
document.getElementById('processAudioFile').addEventListener('click', function() {
    const fileInput = document.getElementById('audioFileInput');
    const file = fileInput.files[0];
    
    if (!file) {
        alert('Por favor, selecione um arquivo de áudio.');
        return;
    }
    
    processAudioFile(file);
});

function processAudioFile(file) {
    const statusDiv = document.getElementById('processingStatus');
    statusDiv.innerHTML = '<div class="alert alert-info">🔄 Processando arquivo de áudio...</div>';
    
    // Criar um elemento de áudio temporário para processar o arquivo
    const audio = new Audio();
    const audioURL = URL.createObjectURL(file);
    audio.src = audioURL;
    
    // Usar Web Speech API com MediaStream do arquivo
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        try {
            // Criar um contexto de áudio para processar o arquivo
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const fileReader = new FileReader();
            
            fileReader.onload = function(e) {
                audioContext.decodeAudioData(e.target.result)
                    .then(audioBuffer => {
                        // Simular transcrição (em um ambiente real, você usaria um serviço de transcrição)
                        statusDiv.innerHTML = '<div class="alert alert-warning">⚠️ Nota: A transcrição de arquivos requer integração com serviços externos como Google Speech-to-Text ou Azure Speech Services. Por enquanto, você pode inserir a transcrição manualmente abaixo.</div>';
                        
                        // Adicionar campo para transcrição manual
                        const manualTranscriptionDiv = document.createElement('div');
                        manualTranscriptionDiv.innerHTML = `
                            <div class="mt-3">
                                <label for="manualTranscription">Transcrição Manual:</label>
                                <textarea id="manualTranscription" class="form-control" rows="4" placeholder="Cole ou digite a transcrição do arquivo de áudio aqui..."></textarea>
                                <button id="processManualTranscription" class="btn btn-primary mt-2">Processar Transcrição</button>
                            </div>
                        `;
                        statusDiv.appendChild(manualTranscriptionDiv);
                        
                        // Processar transcrição manual
                        document.getElementById('processManualTranscription').addEventListener('click', function() {
                            const manualText = document.getElementById('manualTranscription').value.trim();
                            if (manualText) {
                                fullTranscription = manualText;
                                processTranscription(manualText);
                                statusDiv.innerHTML = '<div class="alert alert-success">✅ Transcrição processada com sucesso!</div>';
                            } else {
                                alert('Por favor, insira a transcrição.');
                            }
                        });
                    })
                    .catch(error => {
                        console.error('Erro ao decodificar áudio:', error);
                        statusDiv.innerHTML = '<div class="alert alert-danger">❌ Erro ao processar o arquivo de áudio. Verifique se o formato é suportado.</div>';
                    });
            };
            
            fileReader.onerror = function() {
                statusDiv.innerHTML = '<div class="alert alert-danger">❌ Erro ao ler o arquivo.</div>';
            };
            
            fileReader.readAsArrayBuffer(file);
            
        } catch (error) {
            console.error('Erro no processamento:', error);
            statusDiv.innerHTML = '<div class="alert alert-danger">❌ Erro ao processar o arquivo. Tente com outro formato.</div>';
        }
    } else {
        statusDiv.innerHTML = '<div class="alert alert-danger">❌ Seu navegador não suporta reconhecimento de fala.</div>';
    }
}

function processTranscription(transcription) {
    const positiveWords = document.getElementById('positiveWords').value.split(',').map(word => word.trim().toLowerCase());
    const negativeWords = document.getElementById('negativeWords').value.split(',').map(word => word.trim().toLowerCase());

    const highlightedTranscription = highlightWords(transcription, positiveWords, negativeWords);
    document.getElementById('transcriptionText').innerHTML = highlightedTranscription;

    // Armazenar transcrição no IndexedDB
    const transaction = db.transaction(['transcriptions'], 'readwrite');
    const store = transaction.objectStore('transcriptions');
    store.add({ text: transcription, source: 'uploaded_file', timestamp: new Date() });

    transaction.oncomplete = function() {
        console.log('Transcrição salva no IndexedDB');
        analyzeTranscription(transcription);
    };
}

// === FUNCIONALIDADE DE GRAVAÇÃO AO VIVO (CÓDIGO ORIGINAL) ===

// Função para começar a gravação
document.getElementById('startRecording').addEventListener('click', function() {
    isRecording = true;
    fullTranscription = '';  // Limpa a transcrição anterior
    recognition.start();
    document.getElementById('startRecording').disabled = true;
    document.getElementById('stopRecording').disabled = false;
});

// Função para parar a gravação
document.getElementById('stopRecording').addEventListener('click', function() {
    isRecording = false;
    recognition.stop();
    document.getElementById('startRecording').disabled = false;
    document.getElementById('stopRecording').disabled = true;
});

// Quando o reconhecimento de fala obtém resultados
recognition.onresult = function(event) {
    for (let i = 0; i < event.results.length; i++) {
        fullTranscription += event.results[i][0].transcript + ' ';
    }

    const positiveWords = document.getElementById('positiveWords').value.split(',').map(word => word.trim().toLowerCase());
    const negativeWords = document.getElementById('negativeWords').value.split(',').map(word => word.trim().toLowerCase());

    const highlightedTranscription = highlightWords(fullTranscription, positiveWords, negativeWords);
    document.getElementById('transcriptionText').innerHTML = highlightedTranscription;

    // Armazenar transcrição no IndexedDB
    const transaction = db.transaction(['transcriptions'], 'readwrite');
    const store = transaction.objectStore('transcriptions');
    store.add({ text: fullTranscription, source: 'live_recording', timestamp: new Date() });

    transaction.oncomplete = function() {
        console.log('Transcrição salva no IndexedDB');
        analyzeTranscription(fullTranscription);
    };
};

// Se a gravação parar automaticamente por conta do silêncio, reiniciamos a gravação
recognition.onend = function() {
    if (isRecording) {
        recognition.start();
    }
};

// === FUNÇÕES COMPARTILHADAS ===

// Função para destacar as palavras positivas e negativas
function highlightWords(transcription, positiveWords, negativeWords) {
    return transcription.split(' ').map(word => {
        const lowerCaseWord = word.toLowerCase().replace(/[^\w]/g, ''); // Remove pontuação
        if (positiveWords.includes(lowerCaseWord)) {
            return `<span class="highlight-positive">${word}</span>`;
        } else if (negativeWords.includes(lowerCaseWord)) {
            return `<span class="highlight-negative">${word}</span>`;
        } else {
            return word;
        }
    }).join(' ');
}

// Handle transcription result and analyze
function analyzeTranscription(transcription) {
    const words = transcription.split(/\s+/);
    const wordCount = {};

    // Contar as ocorrências de palavras
    words.forEach(word => {
        word = word.toLowerCase().replace(/[^\w]/g, ''); // Remove pontuação
        if (word && wordCount[word]) {
            wordCount[word]++;
        } else if (word) {
            wordCount[word] = 1;
        }
    });

    const positiveWords = document.getElementById('positiveWords').value.split(',').map(word => word.trim().toLowerCase());
    const negativeWords = document.getElementById('negativeWords').value.split(',').map(word => word.trim().toLowerCase());

    // Gerar nuvem de palavras (usando o canvas)
    generateWordCloud(wordCount, positiveWords, negativeWords);

    // Gerar ranking de palavras
    generateWordRanking(wordCount, positiveWords, negativeWords);
}

// Gerar a nuvem de palavras com cores para palavras positivas e negativas
function generateWordCloud(wordCount, positiveWords, negativeWords) {
    const canvas = document.getElementById('wordCloudCanvas');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let x = 50;
    let y = 50;

    for (const [word, count] of Object.entries(wordCount)) {
        const fontSize = Math.min(count * 10, 40); // Limita o tamanho máximo
        if (positiveWords.includes(word)) {
            ctx.fillStyle = 'green';
        } else if (negativeWords.includes(word)) {
            ctx.fillStyle = 'red';
        } else {
            ctx.fillStyle = 'black';
        }
        ctx.font = `${fontSize}px Arial`;
        ctx.fillText(word, x, y);
        x += fontSize * 2;
        if (x > canvas.width - fontSize * 2) {
            x = 50;
            y += fontSize * 2;
        }
        if (y > canvas.height - fontSize * 2) {
            break; // Se atingir o final da área visível, para de desenhar
        }
    }
}

// Gerar o ranking de palavras positivas e negativas
function generateWordRanking(wordCount, positiveWords, negativeWords) {
    const positiveRankingTableBody = document.getElementById('positiveRankingTableBody');
    const negativeRankingTableBody = document.getElementById('negativeRankingTableBody');
    
    positiveRankingTableBody.innerHTML = '';
    negativeRankingTableBody.innerHTML = '';

    // Filtros e ordenação das palavras positivas e negativas
    const positiveWordCount = Object.entries(wordCount).filter(([word]) => positiveWords.includes(word));
    const negativeWordCount = Object.entries(wordCount).filter(([word]) => negativeWords.includes(word));

    positiveWordCount.sort((a, b) => b[1] - a[1]);
    negativeWordCount.sort((a, b) => b[1] - a[1]);

    // Preencher tabela de palavras positivas
    positiveWordCount.forEach(([word, count]) => {
        const row = document.createElement('tr');
        row.innerHTML = `<td class="highlight-positive">${word}</td><td>${count}</td>`;
        positiveRankingTableBody.appendChild(row);
    });

    // Preencher tabela de palavras negativas
    negativeWordCount.forEach(([word, count]) => {
        const row = document.createElement('tr');
        row.innerHTML = `<td class="highlight-negative">${word}</td><td>${count}</td>`;
        negativeRankingTableBody.appendChild(row);
    });
}

// Função para baixar os dados (transcrição e rankings) em um arquivo .txt
document.getElementById('downloadData').addEventListener('click', function() {
    const positiveWords = document.getElementById('positiveWords').value;
    const negativeWords = document.getElementById('negativeWords').value;
    const transcription = fullTranscription.trim();

    const positiveRanking = Array.from(document.querySelectorAll('#positiveRankingTableBody tr')).map(row => {
        const word = row.children[0].innerText;
        const count = row.children[1].innerText;
        return `${word}: ${count}`;
    }).join('\n');

    const negativeRanking = Array.from(document.querySelectorAll('#negativeRankingTableBody tr')).map(row => {
        const word = row.children[0].innerText;
        const count = row.children[1].innerText;
        return `${word}: ${count}`;
    }).join('\n');

    const data = `
    Transcrição:
    ${transcription}

    Palavras Positivas:
    ${positiveWords}

    Palavras Negativas:
    ${negativeWords}

    Ranking de Palavras Positivas:
    ${positiveRanking}

    Ranking de Palavras Negativas:
    ${negativeRanking}
    `;

    const blob = new Blob([data], { type: 'text/plain' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'speech_analytics_dados.txt';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
});

</script>
</body>
</html>
